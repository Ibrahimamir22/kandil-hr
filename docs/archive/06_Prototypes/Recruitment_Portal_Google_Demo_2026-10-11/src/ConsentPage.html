<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موافقة على إشعار الخصوصية — قنديل مصر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F5; --card:#FFFFFF; --primary:#A8111C; --primary-2:#8C0E17; --gold:#C6A151; --gold-bg:#F6EEDC; --gold-t:#7A5B17;
  --heading:#1F1A17; --text:#3F3B37; --muted:#6E6862; --border:#ECE7E0; --line:#F1EDE7;
  --ok-t:#157F4A; --ok-bg:#E5F4EC; --warn-t:#B45309; --warn-bg:#FEF1DC; --err-t:#B42318; --err-bg:#FCE8E8; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);min-height:100vh;color:var(--text);font-family:Almarai,Tahoma,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:800;color:var(--heading);margin:0}
button,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;flex-shrink:0}
.brand b{display:block;color:var(--heading);font-size:17px;line-height:1.3}
.brand small{color:var(--muted);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 2px rgba(36,59,69,.06),0 4px 16px rgba(36,59,69,.04);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.pin{display:flex;gap:10px;justify-content:center;direction:ltr}
.pin input{width:100%;max-width:240px;height:56px;text-align:center;font-size:26px;letter-spacing:10px;border:1.5px solid #DDD6CC;border-radius:12px}
.btn{min-height:48px;border-radius:12px;border:1.5px solid #DDD6CC;background:#fff;color:var(--heading);font-weight:700;font-size:15px;padding:0 18px;cursor:pointer}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.ok{background:var(--ok-t);border-color:var(--ok-t);color:#fff}
.btn.no{color:var(--err-t);border-color:#F3C9C6}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
.k{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--gold-bg);color:var(--gold-t)}
.msg{border-radius:12px;padding:12px 14px;font-size:14px}
.msg.err{background:var(--err-bg);color:var(--err-t)} .msg.ok{background:var(--ok-bg);color:var(--ok-t)} .msg.info{background:var(--gold-bg);color:var(--gold-t)}
textarea{width:100%;min-height:64px;border:1.5px solid #DDD6CC;border-radius:10px;padding:8px 10px;font-size:14px}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--border);background:#fff;font-weight:700;cursor:pointer}
.tab.on{background:var(--heading);color:#fff;border-color:var(--heading)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{border-top:1px solid var(--line);padding:6px 4px;text-align:right;vertical-align:top}
.empty{color:var(--muted);text-align:center;padding:18px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* v0.38.0 — a candidate's own consent to the privacy notice (CHG-81). The token in the link is the key; it works once. */
var TOKEN = '<?= token ?>', ST = { info: null, msg: '', done: false, busy: false, en: false };
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function call(action, payload){
  return new Promise(function(res, rej){
    google.script.run.withSuccessHandler(function(r){ r && r.ok ? res(r.data) : rej(r || {}); })
      .withFailureHandler(function(){ rej({ error: 'مفيش اتصال — جرّب تاني. / No connection — try again.' }); }).apiPublic(action, payload);
  });
}
function head(){ return '<div class="brand"><div class="mark">ق</div><div><b>قنديل مصر — التوظيف</b><small>Kandil Egypt — Recruitment</small></div></div>'; }
function render(){
  var h = head(), I = ST.info;
  if (ST.done) h += '<div class="card"><div class="msg ok">شكراً — موافقتك اتسجلت، وفريق التوظيف هيكمّل معاك.<br>Thank you — your consent is recorded.</div></div>';
  else if (!I) h += '<div class="card">' + (ST.msg ? '<div class="msg err">' + esc(ST.msg) + '</div>' : '<div class="empty">…</div>') + '</div>';
  else {
    h += '<div class="card"><h2>أهلاً ' + esc(I.name) + '</h2><p>قبل ما نكمّل في طلبك' + (I.job ? ' على وظيفة <b>' + esc(I.job) + '</b>' : '') + ' محتاجين موافقتك على طريقة استخدامنا لبياناتك.</p>' +
      (I.entity ? '<span class="k">صاحب العمل / Employer: <b>' + esc(I.entity) + (I.entityEn ? ' — ' + esc(I.entityEn) : '') + '</b></span>' : '') +
      (I.ar ? '<p>' + esc(I.ar) + '</p>' : '') + (I.en ? '<p dir="ltr" class="k">' + esc(I.en) + '</p>' : '') +
      (I.fullAr ? '<details><summary>اقرا الإشعار الكامل / Full notice</summary><div style="white-space:pre-wrap">' + esc(I.fullAr) + '</div>' + (I.fullEn ? '<div dir="ltr" style="white-space:pre-wrap">' + esc(I.fullEn) + '</div>' : '') + '</details>' : '') +
      '<label class="row" style="flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="c1" style="margin-top:5px"><span>قريت إشعار الخصوصية وموافق على معالجة بياناتي لأغراض التوظيف. <span class="k" dir="ltr">I agree to the processing of my data for recruitment.</span></span></label>' +
      '<label class="row" style="flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="c2" style="margin-top:5px"><span>موافق إن بياناتي تتحفظ على خدمات Google وممكن تتعالج برّه مصر. <span class="k" dir="ltr">I agree my data is kept on Google services and may be processed outside Egypt.</span></span></label>' +
      (ST.msg ? '<div class="msg err">' + esc(ST.msg) + '</div>' : '') +
      '<button class="btn p" id="go"' + (ST.busy ? ' disabled' : '') + '>موافق / I agree</button>' +
      (I.email ? '<span class="k">للاستفسار عن بياناتك: <span dir="ltr">' + esc(I.email) + '</span></span>' : '') + '</div>';
  }
  $('app').innerHTML = h;
  if ($('go')) $('go').onclick = accept;
}
function accept(){
  if (!$('c1').checked || !$('c2').checked) { ST.msg = 'لازم توافق على الاتنين عشان نكمّل. / Please accept both.'; render(); return; }
  ST.busy = true; ST.msg = ''; render();
  call('consent.accept', { token: TOKEN, consent: 'Y', consentTransfer: 'Y', version: ST.info.version })
    .then(function(){ ST.done = true; render(); }).catch(function(e){ ST.busy = false; ST.msg = e.error || 'حصل خطأ'; render(); });
}
call('consent.info', { token: TOKEN }).then(function(d){ ST.info = d; render(); }).catch(function(e){ ST.msg = e.error || 'حصل خطأ'; render(); });
render();
</script>
</body>
</html>
