<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحتي — التوظيف في قنديل مصر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F5; --card:#FFFFFF; --primary:#A8111C; --primary-2:#8C0E17; --gold:#C6A151; --gold-bg:#F6EEDC; --gold-t:#7A5B17;
  --heading:#1F1A17; --text:#3F3B37; --muted:#6E6862; --border:#ECE7E0; --line:#F1EDE7;
  --ok-t:#157F4A; --ok-bg:#E5F4EC; --warn-t:#B45309; --warn-bg:#FEF1DC; --err-t:#B42318; --err-bg:#FCE8E8; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);min-height:100vh;color:var(--text);font-family:Almarai,Tahoma,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:800;color:var(--heading);margin:0}
button,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;flex-shrink:0}
.brand b{display:block;color:var(--heading);font-size:17px;line-height:1.3}
.brand small{color:var(--muted);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 2px rgba(36,59,69,.06),0 4px 16px rgba(36,59,69,.04);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.pin{display:flex;gap:10px;justify-content:center;direction:ltr}
.pin input{width:100%;max-width:240px;height:56px;text-align:center;font-size:26px;letter-spacing:10px;border:1.5px solid #DDD6CC;border-radius:12px}
.btn{min-height:48px;border-radius:12px;border:1.5px solid #DDD6CC;background:#fff;color:var(--heading);font-weight:700;font-size:15px;padding:0 18px;cursor:pointer}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.ok{background:var(--ok-t);border-color:var(--ok-t);color:#fff}
.btn.no{color:var(--err-t);border-color:#F3C9C6}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
.k{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--gold-bg);color:var(--gold-t)}
.msg{border-radius:12px;padding:12px 14px;font-size:14px}
.msg.err{background:var(--err-bg);color:var(--err-t)} .msg.ok{background:var(--ok-bg);color:var(--ok-t)} .msg.info{background:var(--gold-bg);color:var(--gold-t)}
textarea{width:100%;min-height:64px;border:1.5px solid #DDD6CC;border-radius:10px;padding:8px 10px;font-size:14px}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--border);background:#fff;font-weight:700;cursor:pointer}
.tab.on{background:var(--heading);color:#fff;border-color:var(--heading)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{border-top:1px solid var(--line);padding:6px 4px;text-align:right;vertical-align:top}
.empty{color:var(--muted);text-align:center;padding:18px 0}
.inp{width:100%;min-height:44px;border:1.5px solid #DDD6CC;border-radius:10px;padding:8px 10px;font-size:15px;background:#fff}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.grid{grid-template-columns:1fr}}
.letter{border:1px solid var(--border);border-radius:12px;padding:12px;max-height:420px;overflow:auto;background:#fff}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* v0.39.0 — the candidate's own page (CHG-83): his consent, his data and CV, interviews to confirm, the offer to answer. */
var TOKEN = '<?= token ?>', ST = { d: null, msg: '', ok: '', busy: false, cv: null };
var EDU = [['', '—'], ['NONE', 'بدون مؤهل'], ['INTERMEDIATE', 'دبلوم (بعد الإعدادية)'], ['SECONDARY', 'ثانوية عامة'], ['ABOVE_INTERMEDIATE', 'معهد فوق المتوسط'], ['BACHELOR', 'بكالوريوس / ليسانس'], ['MASTER', 'ماجستير'], ['PHD', 'دكتوراه']];
var NOTICE = [['', '—'], ['IMMEDIATE', 'فوراً'], ['TWO_WEEKS', 'أسبوعين'], ['ONE_MONTH', 'شهر'], ['TWO_MONTHS', 'شهرين'], ['THREE_PLUS', '3 شهور أو أكتر']];
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function call(action, payload){
  return new Promise(function(res, rej){
    google.script.run.withSuccessHandler(function(r){ r && r.ok ? res(r.data) : rej(r || {}); })
      .withFailureHandler(function(){ rej({ error: 'مفيش اتصال — جرّب تاني.' }); }).apiPublic(action, payload);
  });
}
function opts(list, v){ return list.map(function(o){ return '<option value="' + esc(o[0]) + '"' + (o[0] === v ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join(''); }
function fld(k, label, val, extra){ return '<label class="fl">' + label + '<input class="inp" id="f_' + k + '" value="' + esc(val) + '"' + (extra || '') + '></label>'; }
function render(){
  var d = ST.d, h = '<div class="brand"><div class="mark">ق</div><div><b>صفحتي — التوظيف</b><small>قنديل مصر</small></div></div>';
  if (ST.ok) h += '<div class="msg ok">' + esc(ST.ok) + '</div>';
  if (ST.msg) h += '<div class="msg err">' + esc(ST.msg) + '</div>';
  if (!d) { $('app').innerHTML = h + (ST.msg ? '' : '<div class="card"><div class="empty">…</div></div>'); return; }
  h += '<div class="card"><h2>أهلاً ' + esc(d.name) + '</h2><span class="k">من هنا تكمّل بياناتك وتأكد مواعيدك وترد على العرض.</span></div>';
  if (!d.consentOk) {
    var P = d.privacy || {};
    h += '<div class="card"><h3>إشعار الخصوصية</h3>' + (P.ar ? '<p>' + esc(P.ar) + '</p>' : '') +
      '<label class="row" style="flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="c1" style="margin-top:5px"><span>قريت إشعار الخصوصية وموافق على معالجة بياناتي لأغراض التوظيف.</span></label>' +
      '<label class="row" style="flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="c2" style="margin-top:5px"><span>موافق إن بياناتي تتحفظ على خدمات Google وممكن تتعالج برّه مصر.</span></label>' +
      '<button class="btn p" id="cGo">موافق</button></div>';
    $('app').innerHTML = h; $('cGo').onclick = consent; return;
  }
  (d.apps || []).forEach(function(a){
    h += '<div class="card"><span class="chip">' + esc(a.stage) + '</span><b>' + esc(a.job) + '</b>' + (a.entity ? '<span class="k">' + esc(a.entity) + '</span>' : '');
    a.interviews.forEach(function(iv){
      h += '<div class="msg info"><b>' + esc(iv.round) + '</b> — <span dir="ltr">' + esc(iv.date) + ' ' + esc(iv.time) + '</span><br>' + esc(iv.place) + (iv.confirmed ? '<br>✓ أكّدت حضورك' : '') + '</div>';
      if (iv.canAnswer) h += '<textarea id="ivN_' + esc(iv.id) + '" placeholder="لو هتعتذر اكتب السبب (ممكن نحدد معاد تاني)"></textarea>' +
        '<div class="row"><button class="btn ok" data-iv="' + esc(iv.id) + '" data-a="CONFIRM">✓ هحضر</button><button class="btn no" data-iv="' + esc(iv.id) + '" data-a="DECLINE">مش هقدر</button></div>';
    });
    a.offers.forEach(function(o){
      h += '<h3>العرض الوظيفي ' + esc(o.no) + '</h3><div class="letter">' + o.letter + '</div><span class="k">صالح لحد <span dir="ltr">' + esc(o.validUntil) + '</span></span>';
      if (!o.expired) h += '<textarea id="ofN_' + esc(o.id) + '" placeholder="ملاحظة (اختياري)"></textarea>' +
        '<label class="fl">لو هتعتذر، السبب<select class="inp" id="ofR_' + esc(o.id) + '"><option value="">—</option>' + d.declineReasons.map(function(r){ return '<option value="' + r.code + '">' + esc(r.name) + '</option>'; }).join('') + '</select></label>' +
        '<div class="row"><button class="btn ok" data-of="' + esc(o.id) + '" data-a="ACCEPT">✓ موافق على العرض</button><button class="btn no" data-of="' + esc(o.id) + '" data-a="DECLINE">اعتذار</button></div>';
    });
    h += '</div>';
  });
  var D = d.data;
  h += '<div class="card"><h3>بياناتي</h3><div class="grid">' + fld('Email', 'الإيميل', D.Email, ' dir="ltr" type="email"') +
    (d.needNid ? fld('National_ID', 'الرقم القومي (14 رقم)', '', ' dir="ltr" inputmode="numeric" maxlength="14"') : '') +
    (d.needBirth ? fld('Birth_Date', 'تاريخ الميلاد', '', ' type="date"') : '') +
    fld('Governorate', 'المحافظة', D.Governorate) + fld('City', 'المنطقة', D.City) +
    '<label class="fl">المؤهل<select class="inp" id="f_Education">' + opts(EDU, D.Education) + '</select></label>' + fld('Specialization', 'التخصص', D.Specialization) +
    fld('Graduation_Year', 'سنة التخرج', D.Graduation_Year, ' inputmode="numeric" maxlength="4"') + fld('Experience_Years', 'سنين الخبرة', D.Experience_Years, ' inputmode="decimal"') +
    fld('Current_Employer', 'جهة العمل الحالية', D.Current_Employer) + fld('Current_Title', 'الوظيفة الحالية', D.Current_Title) +
    '<label class="fl">تقدر تبدأ إمتى<select class="inp" id="f_Notice_Period">' + opts(NOTICE, D.Notice_Period) + '</select></label>' +
    '<label class="fl">نتواصل معاك إزاي<select class="inp" id="f_Preferred_Channel">' + opts([['', '—']].concat(Object.keys(d.channels).map(function(k){ return [k, d.channels[k]]; })), D.Preferred_Channel) + '</select></label></div>' +
    '<label class="fl">السيرة الذاتية ' + (d.hasCv ? '(مرفوعة: ' + esc(d.cvName) + ' — تقدر تغيّرها)' : '') + '<input type="file" id="cv" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" class="inp"></label>' +
    '<button class="btn p" id="save"' + (ST.busy ? ' disabled' : '') + '>حفظ</button></div>';
  $('app').innerHTML = h;
  bind();
}
function bind(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-iv]'), function(b){ b.onclick = function(){
    var n = ($('ivN_' + b.dataset.iv) || {}).value || '';
    run('self.interview', { Interview_ID: b.dataset.iv, answer: b.dataset.a, note: n }, b.dataset.a === 'CONFIRM' ? 'تمام — أكّدنا حضورك.' : 'اتسجل اعتذارك، وهنتواصل معاك.');
  }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-of]'), function(b){ b.onclick = function(){
    var id = b.dataset.of, n = ($('ofN_' + id) || {}).value || '', r = ($('ofR_' + id) || {}).value || '';
    if (b.dataset.a === 'ACCEPT' && !confirm('موافق على العرض؟')) return;
    run('self.offer', { Offer_ID: id, answer: b.dataset.a, reason: r, note: n }, b.dataset.a === 'ACCEPT' ? 'مبروك! اتسجلت موافقتك، وفريق التوظيف هيكلمك بخطوات الاستلام.' : 'اتسجل اعتذارك. شكراً لوقتك.');
  }; });
  if ($('cv')) $('cv').onchange = function(){
    var f = this.files && this.files[0]; if (!f) return;
    var ext = (f.name.split('.').pop() || '').toLowerCase(), mime = { pdf:'application/pdf', doc:'application/msword', docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png' }[ext];
    if (!mime || f.size > 5 * 1024 * 1024) { ST.msg = 'الملف لازم يكون PDF أو Word أو صورة وأقل من 5 ميجا.'; render(); return; }
    var rd = new FileReader(); rd.onload = function(){ ST.cv = { name: f.name, mime: mime, data: String(rd.result).split(',')[1] }; }; rd.readAsDataURL(f);
  };
  if ($('save')) $('save').onclick = function(){
    var fields = {};
    Array.prototype.forEach.call(document.querySelectorAll('[id^="f_"]'), function(el){ fields[el.id.slice(2)] = el.value; });
    var p = { fields: fields }; if (ST.cv) p.cv = ST.cv;
    run('self.save', p, 'اتحفظت بياناتك.');
  };
}
function run(action, p, okMsg){
  p.token = TOKEN; ST.busy = true; ST.msg = ''; ST.ok = '';
  call(action, p).then(function(d){ ST.busy = false; ST.d = d; ST.cv = null; ST.ok = okMsg; render(); window.scrollTo(0, 0); })
    .catch(function(e){ ST.busy = false; ST.msg = e.error || 'حصل خطأ'; render(); window.scrollTo(0, 0); });
}
function consent(){
  if (!$('c1').checked || !$('c2').checked) { ST.msg = 'لازم توافق على الاتنين عشان نكمّل.'; render(); return; }
  run('self.consent', { consent: 'Y', consentTransfer: 'Y', version: ST.d.privacy.version }, 'شكراً — موافقتك اتسجلت.');
}
call('self.info', { token: TOKEN }).then(function(d){ ST.d = d; render(); }).catch(function(e){ ST.msg = e.error || 'حصل خطأ'; render(); });
render();
</script>
</body>
</html>
