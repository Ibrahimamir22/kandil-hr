<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">

<title>التقديم على وظيفة — قنديل مصر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Unna:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F5; --card:#FFFFFF; --primary:#A8111C; --primary-2:#8C0E17; --gold:#C6A151; --gold-bg:#F6EEDC; --gold-t:#7A5B17;
  --heading:#1F1A17; --text:#3F3B37; --muted:#6E6862; --border:#ECE7E0; --line:#F1EDE7; --select:#FBECEC;
  --ok-t:#157F4A; --ok-bg:#E5F4EC; --warn-t:#B45309; --warn-bg:#FEF1DC; --err-t:#B42318; --err-bg:#FCE8E8;
  --input:#FFFFFF; --input-b:#DDD6CC; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);min-height:100vh;color:var(--text);font-family:Almarai,Tahoma,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Almarai,Tahoma,sans-serif;font-weight:800;color:var(--heading);margin:0}
[lang="en"] h1,[lang="en"] h2,[lang="en"] .brand b{font-family:Unna,Georgia,serif;font-weight:700}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Almarai;font-weight:700;font-size:21px;flex-shrink:0}
.brand b{display:block;font-family:Almarai;color:var(--heading);font-size:17px;line-height:1.3}
.brand small{color:var(--muted);font-size:12.5px}
.lang{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:none;background:transparent;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--primary);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 2px rgba(36,59,69,.06),0 4px 16px rgba(36,59,69,.04)}
.job{padding:22px 22px 20px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--gold)}
.job h1{font-size:28px;line-height:1.35}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--gold-bg);color:var(--gold-t);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.summary{white-space:pre-line;font-size:14.5px;color:var(--text);border-top:1px solid var(--line);padding-top:10px}
.sec{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.sec h2{font-size:20px;color:var(--primary);display:flex;align-items:center;gap:10px}
.sec h2 i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-family:Almarai;font-size:14px;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid > *{min-width:0}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--heading)}
.req{color:var(--err-t)}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.inp{height:46px;border:1.5px solid var(--input-b);background:var(--input);border-radius:10px;padding:0 12px;font-size:15px;color:var(--heading);width:100%;outline:none}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(198,161,81,.18);background:#fff}
textarea.inp{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.ltr{direction:ltr;text-align:right}
[dir="ltr"] .ltr{text-align:left}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--heading);background:#fff}
.radios input{accent-color:var(--primary);width:17px;height:17px}
.file{border:2px dashed #DDD6CC;border-radius:12px;padding:18px;text-align:center;cursor:pointer;background:#FBFCFC;display:flex;flex-direction:column;gap:6px;align-items:center}
.file:hover{border-color:var(--gold)}
.file b{color:var(--primary)}
.phrow{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.phav{width:56px;height:56px;border-radius:50%;background:#F1ECE4 center/cover no-repeat;flex:none}
.phbtn{border:1px solid #DDD6CC;background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit;color:var(--primary);font-weight:600}
.file.has{border-style:solid;border-color:var(--ok-t);background:var(--ok-bg)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.8;background:var(--bg);border-radius:12px;padding:12px 14px;cursor:pointer}
.consent input{width:20px;height:20px;margin-top:4px;accent-color:var(--primary);flex:none}
.btn{height:50px;border-radius:12px;border:none;background:var(--primary);color:#fff;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.btn:hover{background:var(--primary-2)}
.btn:disabled{opacity:.6;cursor:wait}
.msg{border-radius:10px;padding:11px 14px;font-size:14px}
.msg.err{background:var(--err-bg);color:var(--err-t)}
.msg.info{background:var(--gold-bg);color:var(--gold-t)}
.done{padding:34px 24px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.done .ok{width:68px;height:68px;border-radius:50%;background:var(--ok-bg);color:var(--ok-t);display:grid;place-items:center;font-size:32px}
.ref{font-family:Almarai;font-size:20px;color:var(--heading);direction:ltr;background:var(--bg);border-radius:10px;padding:6px 16px}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);opacity:0;pointer-events:none}
.foot{text-align:center;font-size:12px;color:var(--muted)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 0;color:var(--muted)}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:640px){ .grid{grid-template-columns:1fr} .job h1{font-size:21px} .sec,.job{padding:18px 16px} }
</style>
</head>

      '<div class="f full"><label class="f"><span>' + t('emp') + '</span></label><div class="radios"><label><input type="radio" name="emp" value="Y"' + (fv('Is_Employee') === 'Y' ? ' checked' : '') + '>' + t('yes') + '</label><label><input type="radio" name="emp" value=""' + (fv('Is_Employee') !== 'Y' ? ' checked' : '') + '>' + t('no') + '</label></div></div>' +
      '<div id="empBox" class="full' + (fv('Is_Employee') === 'Y' ? '' : '" style="display:none') + '">' + field('Employee_ID', t('empId'), inp('Employee_ID', 'text', ' inputmode="numeric"'), true) + '</div>' +
      field('Referrer_Name', t('ref'), inp('Referrer_Name', 'text'), false, t('refH'), 'full') +
      '<div class="f full"><label class="f"><span>' + t('rel') + '</span></label><div class="radios"><label><input type="radio" name="rel" value="Y"' + (fv('Has_Relative') === 'Y' ? ' checked' : '') + '>' + t('yes') + '</label><label><input type="radio" name="rel" value="N"' + (fv('Has_Relative') === 'N' ? ' checked' : '') + '>' + t('no') + '</label></div></div>' +
      '<div id="relBox" class="full grid' + (fv('Has_Relative') === 'Y' ? '' : '" style="display:none') + '">' + field('Relative_Name', t('relName'), inp('Relative_Name', 'text')) + field('Relative_Relation', t('relRel'), inp('Relative_Relation', 'text')) + '</div>' +

      '<label class="consent full"><input type="checkbox" id="cDis"' + (fv('Disability') === 'Y' ? ' checked' : '') + '><span>' + t('dis') + '</span></label>' +

        '<label class="consent full"><input type="checkbox" id="cGuard"' + (fv('consentGuardian') === 'Y' ? ' checked' : '') + '><span>' + t('cGuard') + '</span></label></div>' +

    '<div class="card sec"><h2><i>4</i>' + t('s4') + (I.cvRequired ? ' <span class="req">*</span>' : ' <span class="hint">' + t('cvOpt') + '</span>') + '</h2>' +
      '<label class="file' + (ST.cv ? ' has' : '') + '" id="cvBox"><input type="file" id="cvIn" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" style="display:none">' +
      (ST.cv ? '<b>✓ ' + esc(ST.cv.name) + '</b><span class="hint">' + t('cvChange') + '</span>' : '<b>' + t('cvPick') + '</b><span class="hint">' + t('cvH') + '</span>') + '</label>' +
      '<div class="phrow"><span class="phav"' + (ST.photo ? ' style="background-image:url(' + ST.photo + ')"' : '') + '></span><label class="phbtn"><input type="file" id="phIn" accept="image/jpeg,image/png" style="display:none">' +
        (ST.photo ? t('photoChange') : t('photoPick')) + '</label>' + (ST.photo ? '<button type="button" class="phbtn" id="phOff">' + t('photoOff') + '</button>' : '') + '</div></div>' +

      '<label class="consent"><input type="checkbox" id="consent"' + (fv('consent') === 'Y' ? ' checked' : '') + '><span><b>' + t('consent') + '</b> ' + esc(en ? I.privacy.en : I.privacy.ar) +
        ((en ? I.privacy.fullEn : I.privacy.fullAr) ? ' <a href="#" id="fullLink" style="color:var(--primary)">' + t('full') + '</a>' : '') + '</span></label>' +
      '<div id="fullBox" class="summary" style="display:none;max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:10px">' + esc(en ? I.privacy.fullEn : I.privacy.fullAr) + '</div>' +
      '<label class="consent"><input type="checkbox" id="cTransfer"' + (fv('consentTransfer') === 'Y' ? ' checked' : '') + '><span>' + t('cTransfer') + '</span></label>' +

/* job-specific screening questions (no pass rules reach this page) */
function questionsHtml(qs, en){
  if (!qs.length) return '';
  return '<div class="card sec"><h2><i>✓</i>' + t('sQ') + '</h2><div class="grid">' + qs.map(function(q){
    var label = en ? q.en : q.ar, cur = (ST.q || {})[q.id] || '', inner;
    if (q.type === 'YES_NO') inner = '<div class="radios"><label><input type="radio" name="q_' + q.id + '" value="Y"' + (cur === 'Y' ? ' checked' : '') + '>' + t('qYes') + '</label><label><input type="radio" name="q_' + q.id + '" value="N"' + (cur === 'N' ? ' checked' : '') + '>' + t('qNo') + '</label></div>';
    else if (q.type === 'CHOICE') inner = '<select class="inp" data-q="' + q.id + '"><option value="">' + t('choose') + '</option>' + q.options.map(function(o){ return '<option value="' + esc(o.v) + '"' + (o.v === cur ? ' selected' : '') + '>' + esc(en ? (o.en || o.ar) : o.ar) + '</option>'; }).join('') + '</select>';
    else if (q.type === 'NUMBER') inner = '<input class="inp ltr" data-q="' + q.id + '" inputmode="decimal" maxlength="5" value="' + esc(cur) + '">';
    else inner = '<input class="inp" data-q="' + q.id + '" maxlength="200" value="' + esc(cur) + '">';
    return '<div class="f full"><label class="f"><span>' + esc(label) + (q.required ? ' <span class="req">*</span>' : '') + '</span></label>' + inner + '</div>';
  }).join('') + '</div></div>';
}
function collectQ(){
  ST.q = ST.q || {};
  Array.prototype.forEach.call(document.querySelectorAll('[data-q]'), function(el){ ST.q[el.dataset.q] = el.value; });
  Array.prototype.forEach.call(document.querySelectorAll('input[type="radio"][name^="q_"]:checked'), function(el){ ST.q[el.name.slice(2)] = el.value; });
}
function bindLang(){ Array.prototype.forEach.call(document.querySelectorAll('[data-l]'), function(b){ b.onclick = function(){ setLang(b.dataset.l); }; }); }
var MIME_BY_EXT = { pdf:'application/pdf', doc:'application/msword', docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png' };
function pickCv(){
  var file = this.files && this.files[0]; if (!file) return;
  collect();
  var ext = (file.name.split('.').pop() || '').toLowerCase(), mime = MIME_BY_EXT[ext];
  if (!mime) { ST.err = t('badFile'); render(); return; }
  if (file.size > 5 * 1024 * 1024) { ST.err = t('bigFile'); render(); return; }
  var rd = new FileReader();
  rd.onload = function(){ ST.cv = { name: file.name, mime: mime, data: String(rd.result).split(',')[1] }; ST.err = ''; render(); };
  rd.readAsDataURL(file);
}
/* optional personal photo: shrunk here to a 160×160 JPEG (~10 KB) before it is sent */
function pickPhoto(){
  var file = this.files && this.files[0]; if (!file) return;
  collect();
  if (!/^image\/(jpeg|png)$/.test(file.type) || file.size > 15 * 1024 * 1024) { ST.err = t('badFile'); render(); return; }
  var rd = new FileReader();
  rd.onload = function(){
    var img = new Image();
    img.onload = function(){
      var S = 160, c = document.createElement('canvas'); c.width = S; c.height = S;
      var k = Math.max(S / img.width, S / img.height), w = img.width * k, h = img.height * k;
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, S, S); g.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
      ST.photo = c.toDataURL('image/jpeg', 0.82); ST.err = ''; render();
    };
    img.onerror = function(){ ST.err = t('badFile'); render(); };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
function submit(){
  collect();
  if (ST.f.consent !== 'Y') { ST.err = t('needConsent'); render(); $('err').scrollIntoView({ block: 'center' }); return; }
  if (ST.f.consentTransfer !== 'Y') { ST.err = t('needTransfer'); render(); $('err').scrollIntoView({ block: 'center' }); return; }
  if (ST.f.Has_Relative === 'Y' && (String(ST.f.Relative_Name || '').trim().length < 3 || !String(ST.f.Relative_Relation || '').trim())) { ST.err = t('needRel'); render(); $('err').scrollIntoView({ block: 'center' }); return; }
  if (ST.f.Minor === 'Y' && (String(ST.f.Guardian_Name || '').trim().length < 5 || !String(ST.f.Guardian_Mobile || '').trim() || ST.f.consentGuardian !== 'Y')) { ST.err = t('needGuard'); render(); $('err').scrollIntoView({ block: 'center' }); return; }
  if (['Expected_Salary', 'Expected_Salary_Max'].some(function(k){ var x = String(ST.f[k] || '').replace(/[,\s]/g, '').replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }); return x !== '' && /^\d+$/.test(x) && Number(x) === 0; })) { ST.err = t('salZero'); render(); $('err').scrollIntoView({ block: 'center' }); return; }
  if ((ST.f.Expected_Salary || ST.f.Expected_Salary_Max) && ST.f.consentSalary !== 'Y') { ST.err = t('needSalary'); render(); $('err').scrollIntoView({ block: 'center' }); return; }
  var p = {}; for (var k in ST.f) p[k] = ST.f[k];
  p.code = CODE; p.src = SRC; p.ad = AD; p.lang = ST.lang; p.consentVersion = ST.info.privacy.version; p.elapsed = Date.now() - ST.t0; p.stamp = ST.info.stamp || '';
  p.website = $('website').value; if (ST.cv) p.cv = ST.cv; if (ST.photo && ST.f.consentPhoto === 'Y') p.photo = ST.photo;
  p.answers = ST.q || {};
  ST.busy = true; ST.err = ''; render();
  call('apply.submit', p).then(function(d){ ST.busy = false; ST.done = d.ref; render(); window.scrollTo(0, 0); })
    .catch(function(e){ ST.busy = false; ST.err = e.error || t('netErr'); render(); $('err').scrollIntoView({ block: 'center' }); });
}
ST.lang = '<?= lang ?>' === 'en' ? 'en' : 'ar';
setLang(ST.lang);
call('apply.info', { code: CODE }).then(function(d){ ST.info = d; render(); }).catch(function(e){ ST.info = { closed: true }; render(); });
</script>
