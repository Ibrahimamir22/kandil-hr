<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>المرشحين</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&amp;family=Unna:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F5}
a{color:#A8111C}a:hover{color:#7E0D15}
</style>
</helmet>
<div dir="rtl" style="font-family: 'Almarai', sans-serif; color: #3F3B37; background: #FAF8F5; min-height: 1080px; display: flex; flex-direction: column">

<header style="height: 64px; background: #A8111C; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; gap: 12px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,.16); display: grid; place-items: center; font-family: 'Almarai', sans-serif; font-weight: 800; font-weight: 700; font-size: 18px">ق</span>
<b style="font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 17px">بوابة التوظيف</b>
<span style="opacity: .55">/</span>
<span style="font-size: 14px">المرشحين — محاسب تكاليف · العبور</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button style="height: 40px; padding: 0 16px; border-radius: 10px; border: none; background: #FFFFFF; color: #A8111C; font-family: inherit; font-size: 14px; font-weight: 600">+ إضافة مرشح</button>
<span style="width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font-weight: 700">س</span>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; flex: 1">
<aside style="flex: 1 1 250px; max-width: 280px; background: #FFFFFF; border-left: 1px solid #ECE7E0; padding: 20px 18px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center"><b style="font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 15px; color: #1F1A17">فلترة</b><a href="#" style="font-size: 13px; text-decoration: none">مسح الكل</a></div>
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; color: #6E6862">{{f.label}}
<select style="height: 40px; border: 1px solid #DDD6CC; border-radius: 10px; padding: 0 10px; font-family: inherit; font-size: 14px; color: #1F1A17; background: #FFFFFF"><option>{{f.value}}</option></select>
</label>
</sc-for>
<div style="border-top: 1px solid #ECE7E0; padding-top: 14px; display: flex; flex-direction: column; gap: 10px">
<b style="font-size: 13px; color: #1F1A17">لينك التقديم</b>
<span style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 600; background: #E5F4EC; color: #157F4A"><span style="width: 7px; height: 7px; border-radius: 50%; background: #157F4A"></span>التقديم مفتوح</span>
<button style="height: 40px; border-radius: 10px; border: 1px solid #DDD6CC; background: #FFFFFF; color: #A8111C; font-family: inherit; font-size: 13.5px; font-weight: 600">نسخ لينك Wuzzuf</button>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap">
<div style="flex: 1; min-width: 240px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #DDD6CC; border-radius: 10px; height: 44px; padding: 0 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6862" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span style="color: #9A938B; font-size: 14px">ابحث بالاسم أو الموبايل أو التخصص…</span></div>
<button style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #DDD6CC; background: #FFFFFF; color: #1F1A17; font-family: inherit; font-size: 14px; font-weight: 600">إجراء جماعي</button>
</div>

<div style="display: flex; gap: 24px; border-bottom: 1px solid #ECE7E0; font-size: 14px; font-weight: 600; flex-wrap: wrap">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
<span style="padding: 0 0 12px; display: inline-flex; gap: 6px; align-items: center; color: {{t.color}}; border-bottom: 3px solid {{t.under}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.dot}}"></span>{{t.name}} <span style="background: #F3EFEA; color: #3F3B37; border-radius: 999px; padding: 1px 8px; font-size: 12px">{{t.n}}</span></span>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px">
<sc-for list="{{cands}}" as="c" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #ECE7E0; border-radius: 16px; padding: 18px 18px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 12px; align-items: flex-start">
<span style="width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: 'Almarai', sans-serif; font-weight: 800; font-weight: 600; font-size: 20px; background: {{c.avBg}}; color: {{c.avFg}}; flex: none">{{c.ini}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<b style="font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 16px; color: #1F1A17">{{c.name}}</b>
<span style="font-size: 12.5px; color: #6E6862">{{c.source}} · {{c.age}}</span>
</div>
<span style="display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 600; background: {{c.bg}}; color: {{c.fg}}; white-space: nowrap"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{c.fg}}"></span>{{c.stage}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column"><span style="font-size: 11.5px; color: #6E6862">الخبرة</span><b style="font-size: 14px; color: #1F1A17">{{c.exp}}</b></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 11.5px; color: #6E6862">المؤهل</span><b style="font-size: 14px; color: #1F1A17">{{c.edu}}</b></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 11.5px; color: #6E6862">المتوقع</span><b style="font-size: 14px; color: #1F1A17">{{c.sal}}</b></div>
</div>
<sc-if value="{{c.hasNext}}" hint-placeholder-val="{{ true }}">
<div style="font-size: 12.5px; border-radius: 10px; padding: 8px 10px; background: {{c.nextBg}}; color: {{c.nextFg}}; font-weight: 600">{{c.next}}</div>
</sc-if>
<div style="display: flex; justify-content: space-around; border-top: 1px solid #F1EDE7; margin: 0 -18px; padding: 6px 8px">
<button aria-label="السيرة الذاتية" style="width: 44px; height: 44px; border: none; background: transparent; color: #A8111C; display: grid; place-items: center; border-radius: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></button>
<button aria-label="مكالمة" style="width: 44px; height: 44px; border: none; background: transparent; color: #6E6862; display: grid; place-items: center; border-radius: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></button>
<button aria-label="رسالة جاهزة" style="width: 44px; height: 44px; border: none; background: transparent; color: #6E6862; display: grid; place-items: center; border-radius: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button>
<button aria-label="نقل لمرحلة" style="width: 44px; height: 44px; border: none; background: transparent; color: #6E6862; display: grid; place-items: center; border-radius: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l-6 6 6 6"/></svg></button>
<button aria-label="المزيد" style="width: 44px; height: 44px; border: none; background: transparent; color: #6E6862; display: grid; place-items: center; border-radius: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
</div>
</div>
</sc-for>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      act: { fg: '#B45309', bg: '#FEF1DC' }, run: { fg: '#1F5FBF', bg: '#E7F0FD' }, ok: { fg: '#157F4A', bg: '#E5F4EC' },
      part: { fg: '#6D3FC0', bg: '#F1EBFC' }, no: { fg: '#B42318', bg: '#FCE8E8' }, off: { fg: '#5F5952', bg: '#F1EDE7' }
    };
    const av = [['#FBECEC', '#A8111C'], ['#F6EEDC', '#7A5B17'], ['#F1EDE7', '#3F3B37'], ['#F6EEDC', '#7A5B17']];
    const c = (i, name, ini, source, age, k, stage, exp, edu, sal, next, nk) => Object.assign({
      name, ini, source, age, stage, exp, edu, sal, next, hasNext: !!next,
      avBg: av[i % 4][0], avFg: av[i % 4][1], nextBg: S[nk || 'run'].bg, nextFg: S[nk || 'run'].fg }, S[k]);
    return {
      filters: [
        { label: 'المرحلة', value: 'كل المراحل' }, { label: 'المحافظة', value: 'الكل' }, { label: 'المؤهل', value: 'الكل' },
        { label: 'المصدر', value: 'الكل' }, { label: 'سنين الخبرة', value: 'أي عدد' }
      ],
      tabs: [
        { name: 'الكل', n: 18, color: '#1F1A17', under: '#C6A151', dot: '#C6A151' },
        { name: 'جديد', n: 6, color: '#6E6862', under: 'transparent', dot: '#B45309' },
        { name: 'تم التواصل', n: 4, color: '#6E6862', under: 'transparent', dot: '#1F5FBF' },
        { name: 'فرز مبدئي', n: 3, color: '#6E6862', under: 'transparent', dot: '#1F5FBF' },
        { name: 'قائمة مختصرة', n: 2, color: '#6E6862', under: 'transparent', dot: '#157F4A' },
        { name: 'مرفوض / انسحب', n: 3, color: '#6E6862', under: 'transparent', dot: '#B42318' }
      ],
      cands: [
        c(0, 'محمود حسن إبراهيم', 'م', 'LinkedIn', 'من 3 أيام', 'act', 'جديد — محتاج تواصل', '3 سنين', 'مؤهل عالي', '15,000', 'متأخر: أول مكالمة كانت مطلوبة امبارح', 'no'),
        c(1, 'ياسمين طارق فهمي', 'ي', 'Wuzzuf', 'من 5 أيام', 'ok', 'قائمة مختصرة', '4 سنين', 'مؤهل عالي', '13,000', ''),
        c(2, 'أحمد سمير عبد الرحمن', 'أ', 'فيسبوك', 'من يومين', 'run', 'تم التواصل', '2 سنة', 'مؤهل عالي', '11,000', 'مقابلة تليفونية — الأحد', 'act'),
        c(3, 'كريم عادل فؤاد', 'ك', 'موظف حالي', 'من أسبوع', 'part', 'مرشح داخلي — اتبلّغ مديره', '6 سنين', 'مؤهل عالي', 'لم يُذكر', ''),
        c(0, 'منى سعيد حسن', 'م', 'حضور شخصي', 'النهارده', 'run', 'فرز مبدئي', '1 سنة', 'فوق متوسط', '9,000', 'استنى رد مدير القسم', 'run'),
        c(1, 'شريف ناصر علي', 'ش', 'Wuzzuf', 'من 10 أيام', 'no', 'مرفوض — المرتب أعلى', '8 سنين', 'ماجستير', '25,000', 'رسالة الاعتذار لسه ماتبعتتش', 'act')
      ]
    };
  }
}
</script>
</body>
</html>
