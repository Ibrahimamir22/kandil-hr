<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موافقات الرئيس التنفيذي — قنديل مصر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F5; --card:#FFFFFF; --primary:#A8111C; --primary-2:#8C0E17; --gold:#C6A151; --gold-bg:#F6EEDC; --gold-t:#7A5B17;
  --heading:#1F1A17; --text:#3F3B37; --muted:#6E6862; --border:#ECE7E0; --line:#F1EDE7;
  --ok-t:#157F4A; --ok-bg:#E5F4EC; --warn-t:#B45309; --warn-bg:#FEF1DC; --err-t:#B42318; --err-bg:#FCE8E8; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);min-height:100vh;color:var(--text);font-family:Almarai,Tahoma,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:800;color:var(--heading);margin:0}
button,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;flex-shrink:0}
.brand b{display:block;color:var(--heading);font-size:17px;line-height:1.3}
.brand small{color:var(--muted);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 2px rgba(36,59,69,.06),0 4px 16px rgba(36,59,69,.04);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.pin{display:flex;gap:10px;justify-content:center;direction:ltr}
.pin input{width:100%;max-width:240px;height:56px;text-align:center;font-size:26px;letter-spacing:10px;border:1.5px solid #DDD6CC;border-radius:12px}
.btn{min-height:48px;border-radius:12px;border:1.5px solid #DDD6CC;background:#fff;color:var(--heading);font-weight:700;font-size:15px;padding:0 18px;cursor:pointer}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.ok{background:var(--ok-t);border-color:var(--ok-t);color:#fff}
.btn.no{color:var(--err-t);border-color:#F3C9C6}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
.k{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--gold-bg);color:var(--gold-t)}
.msg{border-radius:12px;padding:12px 14px;font-size:14px}
.msg.err{background:var(--err-bg);color:var(--err-t)} .msg.ok{background:var(--ok-bg);color:var(--ok-t)} .msg.info{background:var(--gold-bg);color:var(--gold-t)}
textarea{width:100%;min-height:64px;border:1.5px solid #DDD6CC;border-radius:10px;padding:8px 10px;font-size:14px}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--border);background:#fff;font-weight:700;cursor:pointer}
.tab.on{background:var(--heading);color:#fff;border-color:var(--heading)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{border-top:1px solid var(--line);padding:6px 4px;text-align:right;vertical-align:top}
.empty{color:var(--muted);text-align:center;padding:18px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* v0.36.0 — the CEO's approvals on his trusted phone: the device key (kept on this phone only) + his PIN. */
var KEY_NAME = 'kceo', ST = { key: '', session: '', data: null, tab: 'inbox', msg: '', busy: false, report: null };
try { ST.key = localStorage.getItem(KEY_NAME) || ''; } catch (e) { ST.key = ''; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function call(action, payload){
  return new Promise(function(res, rej){
    google.script.run.withSuccessHandler(function(r){ r && r.ok ? res(r.data) : rej(r || {}); })
      .withFailureHandler(function(){ rej({ error: 'مفيش اتصال — جرّب تاني.' }); }).apiPublic(action, payload);
  });
}
function head(){ return '<div class="brand"><div class="mark">ق</div><div><b>موافقات الرئيس التنفيذي</b><small>بوابة التوظيف — قنديل مصر</small></div></div>'; }
function render(){
  var h = head();
  if (!ST.key) {
    h += '<div class="card"><h2>الموبايل ده مش متسجل</h2><p>افتح بوابة التوظيف من الموبايل ده وادخل بحسابك مرة واحدة، ومن زرار اسمك اختار «جهاز موثوق للموافقات» واختار رقم سري. بعدها اللينك ده هيفتح على طول.</p></div>';
  } else if (!ST.session) {
    h += '<div class="card"><h2>اكتب الرقم السري</h2><div class="pin"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="الرقم السري"></div>' +
      (ST.msg ? '<div class="msg err">' + esc(ST.msg) + '</div>' : '') + '<button class="btn p" id="go"' + (ST.busy ? ' disabled' : '') + '>فتح</button></div>';
  } else {
    var d = ST.data || { items: [], steps: [] };
    h += '<div class="tabs"><button class="tab' + (ST.tab === 'inbox' ? ' on' : '') + '" data-t="inbox">المطلوب (' + ((d.items || []).length + (d.steps || []).length) + ')</button><button class="tab' + (ST.tab === 'report' ? ' on' : '') + '" data-t="report">تقرير الشهر</button></div>';
    if (ST.msg) h += '<div class="msg ' + (/^✓/.test(ST.msg) ? 'ok' : 'err') + '">' + esc(ST.msg) + '</div>';
    if (ST.tab === 'inbox') {
      var all = (d.items || []).map(function(x){ return { kind: 'CA', id: x.id, tag: x.kindName, title: x.title, sub: x.summary, by: x.by }; })
        .concat((d.steps || []).map(function(x){ return { kind: 'STEP', id: x.id, tag: x.label, title: x.title, sub: '', by: x.by }; }));
      if (!all.length) h += '<div class="card"><div class="empty">مفيش حاجة مستنية حضرتك دلوقتي ✓</div></div>';
      all.forEach(function(x){
        h += '<div class="card"><span class="chip">' + esc(x.tag) + '</span><b>' + esc(x.title) + '</b>' + (x.sub ? '<span>' + esc(x.sub) + '</span>' : '') +
          '<span class="k">من: ' + esc(x.by) + '</span><textarea id="c_' + esc(x.id) + '" placeholder="ملاحظة (مطلوبة مع الرفض)"></textarea>' +
          '<div class="row"><button class="btn ok" data-a="APPROVE" data-k="' + x.kind + '" data-id="' + esc(x.id) + '">✓ موافقة</button><button class="btn no" data-a="REJECT" data-k="' + x.kind + '" data-id="' + esc(x.id) + '">✕ رفض</button></div></div>';
      });
    } else {
      var R = ST.report;
      if (!R) h += '<div class="card"><div class="empty">بيحمّل…</div></div>';
      else {
        var tbl = function(title, rows, cols){ return '<div class="card"><h3>' + title + ' (' + rows.length + ')</h3>' + (rows.length ? '<table>' + rows.map(function(r){ return '<tr>' + cols.map(function(c){ return '<td>' + esc(typeof c === 'function' ? c(r) : r[c]) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>' : '<div class="empty">مفيش</div>') + '</div>'; };
        h += '<div class="msg info">شهر ' + esc(R.month) + '</div>' +
          tbl('قرارات بالتفويض', R.delegated, ['ref', 'step', 'by', 'at']) +
          tbl('طلبات اعتمد فيها شخص واحد أكتر من خطوة', R.doubles, ['ref', 'by', function(r){ return r.steps.join('، '); }]) +
          tbl('تغيير الأدوار', R.roleChanges, ['user', 'action', 'role', 'by', 'at']) +
          tbl('التفويضات', R.delegations, ['to', 'from', 'until', 'status']);
      }
    }
    h += '<button class="btn" id="lock">قفل</button>';
  }
  $('app').innerHTML = h;
  bind();
}
function bind(){
  if ($('pin')) { $('pin').focus(); $('pin').onkeydown = function(e){ if (e.key === 'Enter') unlock(); }; }
  if ($('go')) $('go').onclick = unlock;
  if ($('lock')) $('lock').onclick = function(){ ST.session = ''; ST.data = null; ST.msg = ''; render(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function(b){ b.onclick = function(){ ST.tab = b.dataset.t; ST.msg = ''; render(); if (ST.tab === 'report' && !ST.report) loadReport(); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-a]'), function(b){ b.onclick = function(){ decide(b.dataset.k, b.dataset.id, b.dataset.a); }; });
}
function relockIf(e){ if (e && e.error && /الجلسة خلصت/.test(e.error)) { ST.session = ''; } ST.msg = (e && e.error) || 'حصل خطأ'; render(); }
function unlock(){
  var pin = ($('pin').value || '').trim(); if (!pin) return;
  ST.busy = true; ST.msg = ''; render();
  call('ceoPage.unlock', { key: ST.key, pin: pin }).then(function(r){ ST.busy = false; ST.session = r.session; load(); })
    .catch(function(e){ ST.busy = false; ST.msg = e.error || 'حصل خطأ'; render(); });
}
function load(){ call('ceoPage.inbox', { key: ST.key, session: ST.session }).then(function(d){ ST.data = d; render(); }).catch(relockIf); }
function loadReport(){ call('ceoPage.report', { key: ST.key, session: ST.session }).then(function(r){ ST.report = r; render(); }).catch(relockIf); }
function decide(kind, id, a){
  var c = ($('c_' + id) || {}).value || '';
  if (a === 'REJECT' && c.trim().length < 3) { ST.msg = 'اكتب سبب الرفض في الملاحظة.'; render(); return; }
  call('ceoPage.decide', { key: ST.key, session: ST.session, kind: kind, id: id, decision: a, comment: c })
    .then(function(){ ST.msg = a === 'APPROVE' ? '✓ اتسجلت الموافقة' : '✓ اتسجل الرفض'; load(); }).catch(relockIf);
}
render();
</script>
</body>
</html>
